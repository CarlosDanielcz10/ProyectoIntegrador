<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlowStock | Inicio de Sesión</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <div class="login-container">
        
        <div class="login-header">
            <h1 class="brand-name">GlowStock</h1>
            <p class="brand-subtitle">Gestión de Inventario de Cosméticos</p>
        </div>

        <div class="login-form">
            
            <div class="form-group">
                <label for="usuario">Usuario o Correo</label>
                <input type="text" id="usuario" name="usuario" placeholder="Ej. administrador / encargado">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña">
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" name="recordar"> Recordar mi sesión
                </label>
                <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="button" class="btn-primary" onclick="window.location.href='inv.html'">Entrar al Sistema</button>
            
        </div>

    </div>
    <script src="app.js"></script>
</body>
</html>
